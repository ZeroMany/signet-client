# Builds the Signet client for Windows and Linux on every push and pull
# request. The finished programs appear under "Artifacts" on the run's page
# (GitHub -> Actions tab -> pick a run).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-qt5-static
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libgcrypt
      - name: Build
        run: |
          export PATH=/mingw64/qt5-static/bin:$PATH
          qmake client/client.pro CONFIG+=release
          mingw32-make -j4
      - uses: actions/upload-artifact@v4
        with:
          name: signet-windows
          path: release/signet.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qt5-qmake libqt5svg5-dev \
            libqt5x11extras5-dev libgcrypt20-dev zlib1g-dev libx11-dev
      - name: Build
        run: |
          qmake client/client.pro CONFIG+=release
          make -j4
      - uses: actions/upload-artifact@v4
        with:
          name: signet-linux
          path: |
            signet
            signet-base/signetdev/host/linux/50-signet.rules
