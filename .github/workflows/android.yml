# Builds the Signet Android app (an .apk file) for every pull request and
# every change to main. The finished app appears under "Artifacts" on the
# run's page (GitHub -> Actions tab -> pick an "Android" run).
#
# This is kept apart from ci.yml so the Android build can never affect the
# desktop builds.
name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Qt 5.15.2 is the newest Qt 5 with free Android downloads. It expects
  # Android NDK r21 and Java 11.
  QT_VERSION: '5.15.2'
  NDK_VERSION: '21.4.7075529'
  ANDROID_PLATFORM: android-30
  BUILD_TOOLS: '30.0.3'

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Android NDK and SDK parts
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;$NDK_VERSION" "platforms;$ANDROID_PLATFORM" "build-tools;$BUILD_TOOLS" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # Installed after the SDK step: Android's sdkmanager needs the
      # runner's newer built-in Java, while the Qt 5 build needs Java 11.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android
          cache: true

      - name: Build
        run: |
          mkdir build && cd build
          qmake ../client/client.pro CONFIG+=release \
            ANDROID_SDK_BUILD_TOOLS_REVISION=$BUILD_TOOLS
          make -j4

      - name: Package the app
        run: |
          cd build
          make install INSTALL_ROOT=android-build
          androiddeployqt --input android-signet-deployment-settings.json \
            --output android-build \
            --android-platform $ANDROID_PLATFORM \
            --jdk "$JAVA_HOME" \
            --gradle
          cp android-build/build/outputs/apk/debug/android-build-debug.apk ../signet-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: signet-android
          path: signet-android.apk
